# UriTech production stack — arquitectura inspirada no Gojek:
#   nginx (gateway) → API NestJS + Web Consumer + Admin Portal
#   Mobile apps: build separado via EAS (Expo)

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      NODE_ENV: production
      PORT: 4000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:8080}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/services']
      interval: 30s
      timeout: 5s
      retries: 3

  web-user:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web-user
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      - backend
    restart: unless-stopped

  web-admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web-admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
      - '8080:8080'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web-user
      - web-admin
    restart: unless-stopped
