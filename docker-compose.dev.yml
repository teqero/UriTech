# Postgres local para desenvolvimento (P0 persistência)
# Uso: docker compose -f docker-compose.dev.yml up -d
# DATABASE_URL=postgresql://uritech:uritech@localhost:5432/uritech

services:
  postgres:
    image: postgres:16-alpine
    container_name: uritech-postgres
    environment:
      POSTGRES_USER: uritech
      POSTGRES_PASSWORD: uritech
      POSTGRES_DB: uritech
    ports:
      - '5432:5432'
    volumes:
      - uritech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uritech -d uritech']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  uritech_pgdata:
