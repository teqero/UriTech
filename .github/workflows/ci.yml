name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
      - '!main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          JWT_SECRET: ci-test-secret

      - name: Run unit tests
        run: npm run test --workspace=@uritech/backend
        env:
          JWT_SECRET: ci-test-secret

  mobile-web:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build mobile web (Expo export)
        run: npm run build:mobile-web

  backend-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build --workspace=@uritech/backend

      - name: Start API and smoke test
        run: |
          cd apps/backend
          JWT_SECRET=ci-test-secret NODE_ENV=test node dist/main.js &
          PID=$!
          sleep 8
          curl -fsS http://localhost:4000/api/v1/services
          kill $PID

  edge-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Health
        run: |
          set -e
          BASE="${EDGE_API_BASE:-https://akyzbuvdokdrjpuzhocg.supabase.co/functions/v1/uritech-api/api/v1}"
          curl -fsS --max-time 30 "$BASE/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      - name: Login + wallet
        run: |
          set -e
          BASE="${EDGE_API_BASE:-https://akyzbuvdokdrjpuzhocg.supabase.co/functions/v1/uritech-api/api/v1}"
          curl -fsS --max-time 30 -X POST "$BASE/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"joao@uritech.com","password":"demo123"}' | tee /tmp/login.json
          TOKEN=$(node -e "const j=require('/tmp/login.json'); if(!j.access_token) process.exit(1); process.stdout.write(j.access_token)")
          curl -fsS --max-time 30 "$BASE/wallet" -H "Authorization: Bearer $TOKEN" | tee /tmp/wallet.json
          grep -qE '"balance"|"currency"|"transactions"' /tmp/wallet.json
