name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
      - '!main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          JWT_SECRET: ci-test-secret

      - name: Run unit tests
        run: npm run test --workspace=@uritech/backend
        env:
          JWT_SECRET: ci-test-secret

  backend-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build --workspace=@uritech/backend

      - name: Start API and smoke test
        run: |
          cd apps/backend
          JWT_SECRET=ci-test-secret NODE_ENV=test node dist/main.js &
          PID=$!
          sleep 8
          curl -fsS http://localhost:4000/api/v1/services
          kill $PID
