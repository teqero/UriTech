name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared + backend + web apps
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000/api/v1' }}

      - name: Build Docker images
        run: |
          docker compose -f deploy/docker-compose.prod.yml build

      - name: Smoke test containers
        run: |
          docker compose -f deploy/docker-compose.prod.yml up -d
          sleep 15
          curl -f http://localhost/api/v1/services
          curl -f -o /dev/null -w "%{http_code}" http://localhost/
          docker compose -f deploy/docker-compose.prod.yml down
