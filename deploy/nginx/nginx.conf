worker_processes auto;

events { worker_connections 1024; }

http {
  upstream uritech_api { server backend:4000; }
  upstream uritech_consumer { server web-user:3001; }
  upstream uritech_admin { server web-admin:3000; }

  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  # Consumer app (Gojek-style super app web)
  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://uritech_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://uritech_consumer;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;
    }
  }

  # Admin portal (port 8080 — ops / merchant dashboard)
  server {
    listen 8080;
    server_name _;

    location / {
      proxy_pass http://uritech_admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;
    }
  }
}
